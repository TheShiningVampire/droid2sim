[project]
name = "droid2sim"
version = "0.1.0"
description = "An auditable single-episode DROID to MuJoCo reconstruction"
requires-python = ">=3.12"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["archive/**", "sources/**", "vendor/**", "data/**", ".venv/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
